<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Paneli</title>
<meta name="description" content="Karatay Fen Lisesi 3D baskı katalog yönetim paneli">
<meta name="keywords" content="Admin, 3D Baskı, Karatay Fen Lisesi, Katalog, Yönetim, Tasarım">
<meta name="author" content="Obliv Labs">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
body { margin:0; font-family:'Montserrat', sans-serif; background:#121212; color:#eee; padding:2rem;}
h2 { text-align:center; color:#0d47a1; margin-bottom:2rem; }
form { background:rgba(30,30,40,0.95); padding:1.5rem; border-radius:12px; margin-bottom:2rem; }
input { width:100%; padding:0.6rem; margin:0.5rem 0; border-radius:8px; border:none; background:#222; color:#eee; transition:0.3s; }
input:focus { outline:none; box-shadow:0 0 10px #0d47a1; }
button { padding:0.6rem 1rem; border:none; border-radius:8px; background:#43a047; color:#fff; font-weight:700; cursor:pointer; transition:0.3s; margin-right:0.5rem; }
button:hover { background:#66bb6a; transform:scale(1.02); }
ul { list-style:none; padding:0; }
li { background:#1a1a1a; padding:0.6rem; margin:0.5rem 0; border-radius:8px; display:flex; justify-content:space-between; align-items:center; }
li button { background:#e53935; padding:0.3rem 0.6rem; border:none; border-radius:6px; cursor:pointer; color:#fff; transition:0.3s; }
li button:hover { background:#ff6659; transform:scale(1.05); }
#exportJSON { background:#0d47a1; margin-top:1rem; }
</style>
</head>
<body>

<h2>Admin Paneli</h2>

<form id="adminForm">
  <input type="text" id="title" placeholder="Ürün Adı" required>
  <input type="text" id="image" placeholder="Resim Yolu (images/...) veya URL" required>
  <input type="text" id="link" placeholder="Ürün Linki" required>
  <input type="number" id="price" placeholder="Fiyat (TL)" required>
  <button type="submit">Ekle</button>
</form>

<h3>Katalog</h3>
<ul id="catalogList"></ul>
<button id="exportJSON">JSON Olarak İndir</button>

<script src="js/admin.js"></script>
</body>
</html>
